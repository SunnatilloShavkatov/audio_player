name: audio_player_example
version: 1.0.0+1
publish_to: "none"
description: "Demonstrates how to use the audio_player plugin."

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  rxdart: ^0.28.0
  audio_player:
    path: ../
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  patrol: ^4.11.0
  test: any
  test_api: any
  analysis_lints: ^1.1.1

patrol:
  app_name: Audio Player
  test_directory: patrol_test
  android:
    package_name: uz.plugin.audio_player_example
  ios:
    bundle_id: uz.plugin.audioPlayerExample

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/audio/

