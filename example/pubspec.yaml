name: audio_player_example
version: 1.0.0+1
publish_to: "none"
description: "Demonstrates how to use the audio_player plugin."

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  rxdart: ^0.28.0
  audio_player:
    path: ../
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: any
  analysis_lints: ^1.1.1

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/audio/

