name: audio_player
description: "A feature-rich audio player for Flutter. Loop, clip and sequence any sound from any source (asset/file/URL/stream) in gapless playlists."
version: 1.0.1
repository: https://github.com/SunnatilloShavkatov/audio_player
issue_tracker: https://github.com/SunnatilloShavkatov/audio_player/issues
topics:
  - audio
  - player
  - sound
  - music
  - streaming

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  rxdart: '>=0.28.0 <0.29.0'
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  meta: ^1.19.0
  synchronized: ^3.5.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  analysis_lints: ^1.1.0

flutter:
  plugin:
    platforms:
      android:
        package: uz.plugin.audio_player
        pluginClass: AudioPlayerPlugin
      ios:
        pluginClass: AudioPlayerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AudioPlayerPlugin
        sharedDarwinSource: true
